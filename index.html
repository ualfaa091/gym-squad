<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Squad</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym Squad">
    <link rel="stylesheet" href="style.css">
    <!-- Librerías externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="login-screen" class="screen">
        <h1>🏋️‍♂️ Gym Squad</h1>
        <p>Inicia sesión o regístrate</p>
        <input type="text" id="nombre" placeholder="Tu nombre (solo para registro)">
        <input type="email" id="email" placeholder="Tu correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Entrar</button>
        <button onclick="registrarUsuario()" class="btn-small">Crear cuenta nueva</button>
    </div>

    <div id="pending-screen" class="screen hidden">
        <h1>⏳ Casi listo</h1>
        <p>Tu cuenta se ha creado. Ahora tiene que aprobarte el líder del grupo para que puedas entrar.</p>
        <button onclick="cerrarSesion()" class="btn-small">Salir</button>
    </div>

    <!-- PESTAÑA: HOY -->
    <div id="main-screen" class="screen tab-content hidden">
        <header>
            <h2>El grupo de hoy</h2>
            <button onclick="cerrarSesion()" class="btn-small">Salir</button>
        </header>
        <div id="grid-hoy" class="grid-fichajes"></div>
        <button id="btn-fichar" onclick="abrirCamara()">📸 Fichar hoy</button>
    </div>

    <!-- PESTAÑA: DÍAS (cuadrícula de fotos de un día concreto) -->
    <div id="days-screen" class="screen tab-content hidden">
        <header><h2>Días</h2></header>
        <div class="date-nav">
            <button onclick="cambiarDia(-1)">‹</button>
            <span id="dias-fecha-label"></span>
            <button onclick="cambiarDia(1)">›</button>
        </div>
        <div id="grid-dias" class="grid-fichajes"></div>
    </div>

    <!-- PESTAÑA: CALENDARIO (por persona) -->
    <div id="calendar-screen" class="screen tab-content hidden">
        <header><h2>Calendario</h2></header>
        <div id="selector-personas" class="chips"></div>
        <div class="date-nav">
            <button onclick="cambiarMesCalendario(-1)">‹</button>
            <span id="calendario-mes-label"></span>
            <button onclick="cambiarMesCalendario(1)">›</button>
        </div>
        <div id="calendario-grid" class="calendario-grid"></div>
    </div>

    <!-- PESTAÑA: ESTADÍSTICAS (gráfico + ranking mensual) -->
    <div id="stats-screen" class="screen tab-content hidden">
        <header><h2>Estadísticas</h2></header>
        <div class="date-nav">
            <button onclick="cambiarMesStats(-1)">‹</button>
            <span id="stats-mes-label"></span>
            <button onclick="cambiarMesStats(1)">›</button>
        </div>
        <div class="grafico-wrap">
            <canvas id="grafico-stats"></canvas>
        </div>
        <h3 class="titulo-ranking">Ranking del mes</h3>
        <div id="ranking-lista"></div>
    </div>

    <!-- PESTAÑA: ADMIN (solo el líder) -->
    <div id="admin-screen" class="screen tab-content hidden">
        <header><h2>Administración</h2></header>
        <h3 class="titulo-ranking">Solicitudes pendientes</h3>
        <div id="lista-pendientes"></div>
        <h3 class="titulo-ranking">Miembros del grupo</h3>
        <div id="lista-miembros"></div>
        <h3 class="titulo-ranking">Eliminados</h3>
        <div id="lista-eliminados"></div>
    </div>

    <!-- BARRA DE NAVEGACIÓN INFERIOR -->
    <nav id="bottom-nav" class="hidden">
        <button data-tab="main" onclick="cambiarPestana('main')"><span class="icono">🏠</span>Hoy</button>
        <button data-tab="days" onclick="cambiarPestana('days')"><span class="icono">🗓️</span>Días</button>
        <button data-tab="calendar" onclick="cambiarPestana('calendar')"><span class="icono">📅</span>Calendario</button>
        <button data-tab="stats" onclick="cambiarPestana('stats')"><span class="icono">📊</span>Stats</button>
        <button id="nav-admin" data-tab="admin" class="hidden" onclick="cambiarPestana('admin')"><span class="icono">👑</span>Admin</button>
    </nav>

    <div id="camera-modal" class="hidden">
        <video id="video-camara" autoplay playsinline></video>
        <button id="btn-capturar" onclick="tomarFoto()">Tomar Foto</button>
        <button id="btn-voltear" onclick="voltearCamara()">🔄 Voltear cámara</button>
        <button id="btn-cerrar-camara" onclick="cerrarCamara()">Cancelar</button>
        <canvas id="canvas-foto" class="hidden"></canvas>
    </div>

    <div id="lightbox" class="hidden" onclick="cerrarLightbox()">
        <img id="lightbox-img" src="" alt="Foto ampliada">
    </div>

    <!-- Solo cargamos tu código aquí -->
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(console.error);
            });
        }
    </script>
</body>
</html>
