<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Squad</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym Squad">
    <link rel="stylesheet" href="style.css">
    <!-- Solo cargamos Supabase aquí -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="login-screen" class="screen">
        <h1>🏋️‍♂️ Gym Squad</h1>
        <p>Inicia sesión o regístrate</p>
        <input type="text" id="nombre" placeholder="Tu nombre (solo para registro)">
        <input type="email" id="email" placeholder="Tu correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Entrar</button>
        <button onclick="registrarUsuario()" class="btn-small">Crear cuenta nueva</button>
    </div>

    <div id="main-screen" class="screen hidden">
        <header>
            <h2>El grupo de hoy</h2>
            <button onclick="cerrarSesion()" class="btn-small">Salir</button>
        </header>
        <div id="feed-entrenamientos" class="feed"></div>
        <button id="btn-fichar" onclick="abrirCamara()">📸 Fichar hoy</button>
    </div>

    <div id="camera-modal" class="hidden">
        <video id="video-camara" autoplay playsinline></video>
        <button id="btn-capturar" onclick="tomarFoto()">Tomar Foto</button>
        <button id="btn-cerrar-camara" onclick="cerrarCamara()">Cancelar</button>
        <canvas id="canvas-foto" class="hidden"></canvas>
    </div>

    <!-- Solo cargamos tu código aquí -->
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(console.error);
            });
        }
    </script>
</body>
</html>
